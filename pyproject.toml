[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "artifactproof"
version = "0.1.0"
description = "离线可复现产物核验站：安全扫描归档、规范化清单、版本化策略差异比较与字节稳定证明"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
artifactproof = "artifactproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
artifactproof = ["web/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
